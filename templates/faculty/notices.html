{% extends "base_faculty.html" %}
{% block title %}Notices{% endblock %}
{% block content %}
<div class="screen-title"><h2>Campus Notices</h2></div>
{% for n in notices %}
<div class="card">
  <strong>{{ n.title }}</strong>
  <p class="muted" style="margin:6px 0 0">{{ n.body }}</p>
</div>
{% else %}
<p class="muted">No notices right now.</p>
{% endfor %}
{% endblock %}
