{% extends "base_faculty.html" %}
{% block title %}My Reports{% endblock %}
{% block content %}
<div class="screen-title"><h2>My Reports</h2></div>
<div class="tabs" id="tabs">
  <button class="on" data-b="all">All</button>
  <button data-b="open">Open</button>
  <button data-b="in_progress">In Progress</button>
  <button data-b="resolved">Resolved</button>
</div>
<div id="list"><p class="muted">Loading…</p></div>
{% endblock %}
{% block scripts %}
<script>
const BUCKET = { reported:"open", verified:"open", assigned:"in_progress",
  in_progress:"in_progress", resolved:"resolved", admin_verified:"resolved", closed:"resolved" };
let ALL = [], filter = "all";

function draw() {
  const el = document.getElementById("list");
  const rows = ALL.filter(g => filter === "all" || BUCKET[g.status] === filter);
  if (!rows.length) { el.innerHTML = "<p class='muted'>No reports here.</p>"; return; }
  el.innerHTML = rows.map(g => {
    const sev = g.severity || "medium";
    const d = g.created_at ? new Date(g.created_at * 1000).toLocaleDateString(
      undefined, { day:"numeric", month:"short" }) : "";
    return `<a class="card rcard" href="/grievance/${g.code}">
      <div class="top"><div><div class="code">${g.code}</div>
        <div class="cat">${g.category || "Pending review"}</div></div>
        <span class="badge-pri ${sev}">${sev[0].toUpperCase()+sev.slice(1)}</span></div>
      <div class="loc">${g.location_label}</div>
      <div class="desc">${g.title || ""}</div>
      <div class="foot"><span class="chip ${g.status}">${g.status.replace("_"," ")}</span>
        <span class="tiny muted">${d}</span></div>
    </a>`;
  }).join("");
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#tabs button").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); filter = b.dataset.b; draw();
});
fetch("/my-reports/data").then(r => r.json()).then(({grievances}) => { ALL = grievances; draw(); });
</script>
{% endblock %}
