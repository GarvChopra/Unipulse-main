<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e2f5c">
  <title>{% block title %}UNIFIX{% endblock %} &middot; {{ glb.short }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <style>
    .doc{max-width:760px;margin:0 auto;padding:24px 18px 64px}
    .doc h1{font-size:22px;margin:.2em 0 .1em}
    .doc h2{font-size:16px;margin:1.6em 0 .4em}
    .doc p,.doc li{line-height:1.6;color:#243}
    .doc .updated{color:#789;font-size:13px}
    .doc a{color:#12885a}
    .doc table{border-collapse:collapse;width:100%;margin:.6em 0}
    .doc td,.doc th{border:1px solid #dde3ea;padding:6px 9px;text-align:left;font-size:14px;vertical-align:top}
  </style>
</head>
<body>
  <div class="doc">
    <p><a href="/login">&larr; Back to UNIFIX</a></p>
    {% block content %}{% endblock %}
    <hr style="margin:32px 0;border:0;border-top:1px solid #e3e8ef">
    <p class="updated">
      <a href="/privacy">Privacy Policy</a> &middot;
      <a href="/account-deletion">Account &amp; Data Deletion</a> &middot;
      Contact: {{ contact }}
    </p>
  </div>
</body>
</html>
