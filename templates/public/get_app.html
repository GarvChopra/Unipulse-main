<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e2f5c">
  <title>Install the app &middot; UNIFIX</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-hero">
    <img src="{{ url_for('static', filename='img/glb-logo.webp') }}" alt="GL Bajaj">
    <b>UNIFIX</b>
    <span>Campus Grievance &amp; Infrastructure Portal</span>
    <span>{{ glb.name }}</span>
  </div>

  <div class="get-app-body">
    <div class="auth-card get-app-panel">
      <div class="get-app-card" id="get-app-actions">
        <button type="button" class="btn" disabled>Android app coming soon</button>
        <p class="pwa-modal__hint">Use the instant download option below in the meantime.</p>
        <button type="button" class="btn ghost" id="pwa-install-now">Instant download</button>
        <p class="pwa-modal__steps" id="pwa-steps" hidden></p>
      </div>
    </div>

    <p class="auth-foot">
      Accounts are created by the campus administrator.<br>
      <a href="/login">Open UNIFIX in your browser</a> &middot; <a href="/privacy">Privacy</a><br>
      Need help? {{ contact }}
    </p>
  </div>
</div>

<script>
(function(){
  var installBtn = document.getElementById("pwa-install-now");
  var steps = document.getElementById("pwa-steps");
  var deferredPrompt = null;

  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    deferredPrompt = e;
  });
  window.addEventListener("appinstalled", function(){
    deferredPrompt = null;
    steps.textContent = "Installed. You can open UNIFIX from your home screen.";
    steps.hidden = false;
    installBtn.hidden = true;
  });

  // Register the service worker (scope '/') — Chrome only offers the native
  // install prompt once a worker controls the page.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/service-worker.js").catch(function(){});
  }

  installBtn.addEventListener("click", async function(){
    if (!deferredPrompt) {
      // the event can land a couple of seconds after load (esp. right after the
      // service worker first activates) — wait briefly before falling back
      installBtn.disabled = true;
      var waited = 0;
      while (!deferredPrompt && waited < 3000) {
        await new Promise(function(r){ setTimeout(r, 150); });
        waited += 150;
      }
      installBtn.disabled = false;
    }
    if (deferredPrompt) {
      installBtn.disabled = true;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.disabled = false;
      return;
    }
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    steps.innerHTML = ios
      ? 'On iPhone/iPad: tap the <b>Share</b> button in Safari, then <b>Add to Home Screen</b>.'
      : 'If nothing popped up, UNIFIX may already be installed. Otherwise open your '
        + 'browser menu and choose <b>Install app</b> / <b>Add to Home screen</b>.';
    installBtn.hidden = true;
    steps.hidden = false;
  });

  if (window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true) {
    steps.textContent = "UNIFIX is already installed on this device.";
    steps.hidden = false;
    installBtn.hidden = true;
  }
})();
</script>
</body>
</html>
