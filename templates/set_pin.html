<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e2f5c">
  <title>Set a new PIN &middot; UNIFIX</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-hero">
    <img src="{{ url_for('static', filename='img/glb-logo.webp') }}" alt="GL Bajaj">
    <b>UNIFIX</b>
    <span>GL Bajaj Institute of Technology &amp; Management</span>
  </div>

  <div class="auth-card" style="max-width:440px;margin:0 auto">
    <h1>Choose your PIN</h1>
    <p class="sub">You are signed in with a temporary PIN. Set your own before continuing.</p>

    {% if error %}<p class="error" style="margin-bottom:12px">{{ error }}</p>{% endif %}

    <form method="post" action="/set-pin/submit">
      <label for="new">New PIN (4–8 digits)</label>
      <input id="new" name="new" type="password" inputmode="numeric"
             autocomplete="new-password" required placeholder="••••">
      <label for="confirm">Confirm new PIN</label>
      <input id="confirm" name="confirm" type="password" inputmode="numeric"
             autocomplete="new-password" required placeholder="••••">
      <p style="margin-top:18px"><button type="submit" class="btn">Save PIN</button></p>
    </form>

    <p class="tiny muted" style="text-align:center;margin-top:14px">
      <a href="/logout">Sign out</a></p>
  </div>
</div>
</body>
</html>
